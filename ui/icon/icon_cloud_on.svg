<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Near-black like the other settings glyphs: IconToggle multiplies the icon by a colour, so a
       hue here would multiply back to black. It varies opacity instead, which is why this is one
       flat shape with no internal shading. -->
